<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Display System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container-fluid p-4">
    <div class="header d-flex justify-content-between align-items-center">
        <div>
            <h1>🍳 Kitchen Display System</h1>
            <p>Restaurant Order Management</p>
        </div>
        <button class="btn refresh-btn" onclick="loadKitchenItems()">↻ Refresh</button>
    </div>

    <div class="row mt-4 g-3">
        <div class="col-lg-4">
            <div class="status-column preparing">
                <h3>🔥 Preparing</h3>
                <div id="preparingList"></div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="status-column waiting">
                <h3>⏳ Pending</h3>
                <div id="pendingList"></div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="status-column ready">
                <h3>✅ Ready</h3>
                <div id="readyList"></div>
            </div>
        </div>
    </div>
</div>
<script src="api_client.js"></script>
</body>
</html>
