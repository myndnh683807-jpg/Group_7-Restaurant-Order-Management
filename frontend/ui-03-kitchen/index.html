<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UI-03: Màn hình Bếp KDS — CukCuk POS System">
    <title>Màn Hình Bếp KDS (UI-03) — CukCuk POS</title>

    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom Flat Light Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Unified SaaS Navbar -->
    <header class="navbar navbar-expand-lg navbar-pos sticky-top">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand" href="/">
                <span class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded p-1" style="width: 28px; height: 28px; font-size: 0.9rem;">
                    <i class="bi bi-shop"></i>
                </span>
                <span>CukCuk POS</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-grid-1x2-fill me-1"></i> Tổng Quan</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui-01-order/index.html"><i class="bi bi-cart3 me-1"></i> Đặt Món </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui-02-table/index.html"><i class="bi bi-grid-3x3-gap-fill me-1"></i> Sơ Đồ Bàn </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui-03-kitchen/index.html"><i class="bi bi-fire me-1"></i> Bếp KDS </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui-04-pos/index.html"><i class="bi bi-receipt-cutoff me-1"></i> Thu Ngân </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui-05-admin/index.html"><i class="bi bi-shield-lock-fill me-1"></i> Quản Trị </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <button id="btnRefresh" class="btn btn-sm btn-outline-secondary bg-white">
                        <i class="bi bi-arrow-clockwise me-1"></i> Làm Mới
                    </button>
                    <span class="badge bg-light text-secondary border px-3 py-2">
                        <i class="bi bi-person-fill text-primary me-1"></i> Phụ trách: <strong> </strong>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content: KDS Kanban Board -->
    <main class="container-fluid px-lg-4 py-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h6 class="fw-bold mb-0 text-dark">Điều Phối Món Ăn Bếp (Kitchen Display System)</h6>
                <span class="text-muted small">Cập nhật tiến độ chế biến và phục vụ món ăn theo thời gian thực</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1 small">
                    <i class="bi bi-broadcast me-1"></i> Tự động đồng bộ
                </span>
            </div>
        </div>

        <div class="row g-3">
            <!-- 1. Pending Column -->
            <div class="col-12 col-md-6 col-xl-3">
                <div class="kanban-col">
                    <div class="kanban-header">
                        <h6>
                            <i class="bi bi-hourglass-split text-warning"></i>
                            <span>1. Chờ Nấu</span>
                        </h6>
                        <span id="countPending" class="badge bg-warning text-dark px-2">0</span>
                    </div>
                    <div id="colPending" class="kanban-body">
                        <!-- Dynamic tickets -->
                    </div>
                </div>
            </div>

            <!-- 2. Preparing Column -->
            <div class="col-12 col-md-6 col-xl-3">
                <div class="kanban-col">
                    <div class="kanban-header">
                        <h6>
                            <i class="bi bi-fire text-primary"></i>
                            <span>2. Đang Nấu</span>
                        </h6>
                        <span id="countPreparing" class="badge bg-primary text-white px-2">0</span>
                    </div>
                    <div id="colPreparing" class="kanban-body">
                        <!-- Dynamic tickets -->
                    </div>
                </div>
            </div>

            <!-- 3. Ready Column -->
            <div class="col-12 col-md-6 col-xl-3">
                <div class="kanban-col">
                    <div class="kanban-header">
                        <h6>
                            <i class="bi bi-check2-circle text-success"></i>
                            <span>3. Đã Nấu Xong</span>
                        </h6>
                        <span id="countReady" class="badge bg-success text-white px-2">0</span>
                    </div>
                    <div id="colReady" class="kanban-body">
                        <!-- Dynamic tickets -->
                    </div>
                </div>
            </div>

            <!-- 4. Served Column -->
            <div class="col-12 col-md-6 col-xl-3">
                <div class="kanban-col">
                    <div class="kanban-header">
                        <h6>
                            <i class="bi bi-send-check text-secondary"></i>
                            <span>4. Đã Ra Món</span>
                        </h6>
                        <span id="countServed" class="badge bg-light text-secondary border px-2">0</span>
                    </div>
                    <div id="colServed" class="kanban-body">
                        <!-- Dynamic tickets -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- External API Client -->
    <script src="api_client.js"></script>
</body>
</html>
