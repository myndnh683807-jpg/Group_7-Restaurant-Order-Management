<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table & Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-4">

    <h2>Table & Service Management</h2>

    <button
        class="btn btn-primary mb-3"
        onclick="loadTables()"
    >
        Refresh Tables
    </button>

    <div
        id="tableList"
        class="row g-3"
    ></div>

    <hr>

    <h4>Add Table</h4>

    <div class="row g-2">

        <div class="col-md-4">
            <input
                id="tableNumber"
                class="form-control"
                placeholder="Table number"
            >
        </div>

        <div class="col-md-4">
            <input
                id="capacity"
                type="number"
                class="form-control"
                placeholder="Capacity"
            >
        </div>

        <div class="col-md-4">
            <button
                class="btn btn-success"
                onclick="addTable()"
            >
                Add Table
            </button>
        </div>

    </div>

    <hr>

    <h4>Service</h4>

    <div class="row g-3">

        <div class="col-md-4">
            <input
                id="assistTableId"
                type="number"
                class="form-control"
                placeholder="Table ID"
            >

            <button
                class="btn btn-warning mt-2"
                onclick="requestAssistance()"
            >
                Request Assistance
            </button>
        </div>

        <div class="col-md-4">
            <input
                id="paymentOrderId"
                type="number"
                class="form-control"
                placeholder="Order ID"
            >

            <button
                class="btn btn-info mt-2"
                onclick="requestPayment()"
            >
                Request Payment
            </button>
        </div>

        <div class="col-md-4">
            <input
                id="serveItemId"
                type="number"
                class="form-control"
                placeholder="Order Item ID"
            >

            <button
                class="btn btn-dark mt-2"
                onclick="serveFood()"
            >
                Serve Food
            </button>
        </div>

    </div>

    <div id="message" class="mt-4"></div>

</div>

<script src="api_client.js"></script>

</body>
</html>
