<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UI-02 Floor Plan & Active Service Queue</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-4">

    <div class="top-bar">
        <div>
            <h3>UI-02: Floor Plan & Active Service Queue</h3>
            <div class="zone-text">
                Zone: Main Hall
            </div>
        </div>

        <button
            class="btn btn-outline-dark"
            onclick="loadDashboard()"
        >
            Refresh
        </button>
    </div>


    <div class="summary-bar">
        <span>
            Available:
            <strong id="availableCount">0</strong>
        </span>

        <span>
            Occupied:
            <strong id="occupiedCount">0</strong>
        </span>

        <span>
            Reserved:
            <strong id="reservedCount">0</strong>
        </span>

        <span>
            Cleaning:
            <strong id="cleaningCount">0</strong>
        </span>
    </div>


    <div id="message" class="mt-3"></div>


    <div
        id="tableList"
        class="row g-3 mt-1"
    ></div>


    <div class="service-monitor mt-4">

        <h4>
            Active Service Monitor
        </h4>

        <div class="row g-3">

            <div class="col-md-6">

                <div class="monitor-box">

                    <h5>
                        Food Ready For Serving
                    </h5>

                    <div id="readyFoodList">
                    </div>

                </div>

            </div>


            <div class="col-md-6">

                <div class="monitor-box">

                    <h5>
                        Customer Service Calls
                    </h5>

                    <div id="assistanceList">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<div
    class="modal fade"
    id="orderModal"
    tabindex="-1"
>

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="orderModalLabel"
                >
                    Order
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div
                class="modal-body"
                id="orderModalBody"
            >
            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="api_client.js"></script>

</body>
</html>
