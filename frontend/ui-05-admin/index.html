<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UI-05</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2 class="mb-4 text-primary">Admin Dashboard (UC13 & UC14)</h2>

        <!-- UC13: EMPLOYEE MANAGEMENT -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white"><h5 class="mb-0">UC13: Employee Management</h5></div>
            <div class="card-body">
                <form id="employeeForm" class="row g-3 mb-3">
                    <div class="col-md-3"><input type="text" id="empUsername" class="form-control" placeholder="Username" required></div>
                    <div class="col-md-3"><input type="password" id="empPassword" class="form-control" placeholder="Password" required></div>
                    <div class="col-md-3"><input type="text" id="empFullName" class="form-control" placeholder="Full Name" required></div>
                    <div class="col-md-3">
                        <select id="empRole" class="form-select" required>
                            <option value="">Select Role</option>
                            <option value="Manager">Manager</option>
                            <option value="Staff">Staff</option>
                            <option value="Chef">Chef</option>
                        </select>
                    </div>
                    <div class="col-12"><button type="submit" class="btn btn-success">Add Employee</button></div>
                </form>
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr><th>Username</th><th>Full Name</th><th>Role</th></tr>
                    </thead>
                    <tbody id="employeeTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- UC14: INVENTORY MANAGEMENT -->
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white"><h5 class="mb-0">UC14: Inventory Management</h5></div>
            <div class="card-body">
                <form id="inventoryForm" class="row g-3 mb-3">
                    <div class="col-md-3"><input type="text" id="itemName" class="form-control" placeholder="Item Name" required></div>
                    <div class="col-md-3"><input type="number" step="0.1" id="itemQuantity" class="form-control" placeholder="Quantity" required></div>
                    <div class="col-md-3"><input type="text" id="itemUnit" class="form-control" placeholder="Unit (e.g. kg, pcs)" required></div>
                    <div class="col-md-3"><input type="number" step="0.1" id="itemMinQuantity" class="form-control" placeholder="Min Threshold" required></div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Add / Update Inventory</button>
                        <button type="button" id="btnLowStock" class="btn btn-warning ms-2">View Low Stock Alerts</button>
                    </div>
                </form>
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr><th>Item Name</th><th>Quantity</th><th>Unit</th><th>Min Threshold</th></tr>
                    </thead>
                    <tbody id="inventoryTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="api_client.js"></script>
</body>
</html>
